<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edeae0">
  <title>{% block title %}HealthCoach{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <nav class="tabindex" aria-label="Primary navigation">
      <a href="{{ url_for('home') }}" class="brand" translate="no">HealthCoach</a>
      <a href="{{ url_for('ask') }}" class="tab{% if request.endpoint == 'ask' %} current{% endif %}"{% if request.endpoint == 'ask' %} aria-current="page"{% endif %}>Ask</a>
      <a href="{{ url_for('food') }}" class="tab{% if request.endpoint and request.endpoint.startswith('food') %} current{% endif %}"{% if request.endpoint and request.endpoint.startswith('food') %} aria-current="page"{% endif %}>Food</a>
      <a href="{{ url_for('settings') }}" class="tab{% if request.endpoint in ('settings', 'setup') %} current{% endif %}"{% if request.endpoint in ('settings', 'setup') %} aria-current="page"{% endif %}>Settings</a>
      <a href="{{ url_for('more') }}" class="tab{% if request.endpoint == 'more' %} current{% endif %}"{% if request.endpoint == 'more' %} aria-current="page"{% endif %}>More</a>
    </nav>
    <main class="content" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
